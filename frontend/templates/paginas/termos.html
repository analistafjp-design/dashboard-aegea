{% extends "base.html" %}
{% block conteudo %}
<section class="dashboard-simples">
  <div class="titulo-faixa">
    <span class="titulo-faixa__numero"><strong id="termos-dias">—</strong> Dias Restantes</span>
    <h1>ACOMPANHAMENTO DE TERMOS APLICADOS</h1>
    <div class="titulo-faixa__resumo">
      <span>Realizado Total <strong id="termos-total">—</strong></span>
      <span>% Atingimento <strong id="termos-atingimento">—</strong></span>
    </div>
  </div>
  <div class="faixa-indicadores" id="termos-resumo"></div>
  <div class="grade-termos">
    <div class="visual-simples visual-simples--largo"><h2>Realizado por Dia</h2><div class="grafico" id="graf-termos-diario"></div></div>
    <div class="visual-simples"><h2>Serviços x Meta</h2><div class="grafico grafico--compacto" id="graf-termos-servicos"></div></div>
    <div class="visual-simples"><h2>VCG x Meta</h2><div class="grafico grafico--compacto" id="graf-termos-vcg"></div></div>
    <div class="visual-simples visual-simples--largo"><h2>Realizado por Frente</h2><div class="grafico" id="graf-termos-frente"></div></div>
    <div class="visual-simples"><h2>Termos Aplicados por Cidade</h2><div class="grafico grafico--alto" id="graf-termos-cidade"></div></div>
  </div>
</section>
{% endblock %}
